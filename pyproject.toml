[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eventpulse"
version = "0.1.0"
description = "Event-time engagement streaming correctness kernel"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy==1.17.1", "pytest==8.4.1", "pytest-cov==6.2.1", "ruff==0.12.8"]

[project.scripts]
eventpulse = "eventpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=eventpulse --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eventpulse"]

